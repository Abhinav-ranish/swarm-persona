name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          pipx install -q uv==0.12.15  # PyPI over TLS, version-pinned; Ubuntu 24.04 refuses pip --user
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install mitmproxy (for the live guard tests)
        run: uv tool install -q --python 3.12 mitmproxy==11.1.3
      - name: Tests
        run: uv run --python 3.12 --extra dev pytest -q
      - name: Shell scripts parse
        run: bash -n deploy/aws/setup.sh && bash -n deploy/aws/run.sh
