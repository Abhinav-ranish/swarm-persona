[project]
name = "swarm-persona"
version = "0.1.4"
description = "Simulated users walk your web app behind a network write guard and report UX issues on the PR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhinav Ranish" }]
requires-python = ">=3.12"
keywords = ["ux", "qa", "testing", "agents", "browser-use", "playwright", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "browser-use==0.13.10",
  "playwright>=1.50",
  "pyyaml>=6",
  "pydantic>=2.7",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35"]
mcp = ["mcp>=1.10"]
dev = ["pytest>=8"]

[project.scripts]
swarm-persona = "swarm_persona.cli:main"

[project.urls]
Homepage = "https://github.com/Abhinav-ranish/swarm-persona"
Issues = "https://github.com/Abhinav-ranish/swarm-persona/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_persona"]

[tool.pytest.ini_options]
testpaths = ["tests"]
